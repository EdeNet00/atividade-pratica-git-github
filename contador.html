<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador</title>
    <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
    <header>
        <h1>Contador</h1>
        <p>Manipulação de valores com JavaScript</p>
    </header>

    <main class="container">
        <section class="cartao centralizado">
            <h2>Valor atual</h2>

            <p id="valor-contador" class="valor">0</p>

            <div class="acoes">
                <button class="botao" id="diminuir" type="button">
                    Diminuir
                </button>

                <button class="botao" id="aumentar" type="button">
                    Aumentar
                </button>

                <button class="botao secundario" id="reiniciar" type="button">
                    Reiniciar
                </button>
            </div>

            <p><a href="index.html">Voltar ao início</a></p>
        </section>
    </main>

    <script src="js/contador.js"></script>
</body>
</html>
